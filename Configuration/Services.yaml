services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  HauerHeinrich\HhReadableAnchor\:
    resource: '../Classes/*'

  # Shared (eine Instanz pro Request) -> Eindeutigkeit der Anker im Dokument
  HauerHeinrich\HhReadableAnchor\Service\AnchorResolver:
    public: true

  HauerHeinrich\HhReadableAnchor\ViewHelpers\AnchorViewHelper:
    public: true
    shared: false

  HauerHeinrich\HhReadableAnchor\EventListener\AddAnchorFieldToAllContentTypes:
    tags:
      - name: event.listener
        identifier: 'hh-readable-anchor/add-field-to-all-content-types'
        event: TYPO3\CMS\Core\Configuration\Event\AfterTcaCompilationEvent
